name: Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Biome check (lint + format + import order, zero errors)
        run: bunx biome check

      - name: Type check (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
